[project]
name = "grt-mlx"
version = "0.1.0"
description = "A small MLX implementation of the Gated Recurrent Transformer (recurrent depth with a gated, noise-modulated shared core)"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is not pip-installed in the checkout, so put the repo root on
# sys.path; this makes both `pytest` and `python -m pytest` work.
pythonpath = ["."]
